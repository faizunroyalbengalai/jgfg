name: Deploy spring-boot to EKS

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mnhgfd-spring-boot
  EKS_CLUSTER_NAME: mnhgfd-eks
  APP_NAME: spring-boot
  PROJECT_NAME: mnhgfd
  NAMESPACE: mnhgfd
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      jar_name: ${{ steps.find_jar.outputs.jar_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build JAR
        run: |
          if [ -f mvnw ] && [ -f .mvn/wrapper/maven-wrapper.properties ]; then
            chmod +x mvnw
            ./mvnw clean package -DskipTests
          elif [ -f pom.xml ]; then
            mvn clean package -DskipTests
          elif [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            chmod +x gradlew
            ./gradlew bootJar -x test
          elif [ -f build.gradle ]; then
            gradle bootJar -x test
          else
            echo "No recognized build tool found"
            exit 1
          fi

      - name: Find JAR
        id: find_jar
        run: |
          JAR_PATH=$(find target build/libs -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' ! -name '*plain*' 2>/dev/null | head -1)
          if [ -z "$JAR_PATH" ]; then
            echo "No JAR found"
            exit 1
          fi
          JAR_NAME=$(basename "$JAR_PATH")
          echo "jar_name=$JAR_NAME" >> "$GITHUB_OUTPUT"
          mkdir -p ansible/jar
          cp "$JAR_PATH" ansible/jar/"$JAR_NAME"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ansible/jar/*.jar

  provision:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      cluster_endpoint: ${{ steps.tf_output.outputs.cluster_endpoint }}
      ecr_registry: ${{ steps.ecr_login.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="region=${{ env.AWS_REGION }}" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="app_name=${{ env.APP_NAME }}"

      - name: Get Terraform Outputs
        id: tf_output
        working-directory: terraform
        run: |
          CLUSTER_ENDPOINT=$(terraform output -raw cluster_endpoint 2>/dev/null || echo "")
          echo "cluster_endpoint=$CLUSTER_ENDPOINT" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR Repository if not exists
        run: |
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" --region "${{ env.AWS_REGION }}" 2>/dev/null || \
          aws ecr create-repository --repository-name "${{ env.ECR_REPOSITORY }}" --region "${{ env.AWS_REGION }}"

  configure:
    runs-on: ubuntu-latest
    needs: [build, provision]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ansible/jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        run: |
          ECR_REGISTRY="${{ steps.ecr_login.outputs.registry }}"
          IMAGE_URI="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          LATEST_URI="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest"

          JAR_FILE=$(find ansible/jar -name '*.jar' | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "No JAR found in ansible/jar"
            exit 1
          fi
          JAR_NAME=$(basename "$JAR_FILE")

          cat > Dockerfile.ci <<EOF
          FROM eclipse-temurin:21-jre-alpine
          RUN addgroup -S appgroup && adduser -S appuser -G appgroup
          WORKDIR /opt/app
          COPY ansible/jar/$JAR_NAME app.jar
          RUN chown appuser:appgroup /opt/app/app.jar
          USER appuser
          EXPOSE 8080
          ENV SERVER_PORT=8080
          HEALTHCHECK --interval=30s --timeout=10s --start-period=60s --retries=3 \
            CMD wget -qO- http://localhost:8080/actuator/health || wget -qO- http://localhost:8080/ || exit 1
          ENTRYPOINT ["java", "-jar", "/opt/app/app.jar"]
          EOF

          docker build -f Dockerfile.ci -t "$IMAGE_URI" -t "$LATEST_URI" .
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${{ env.AWS_REGION }}" \
            --name "${{ env.EKS_CLUSTER_NAME }}"

      - name: Create Namespace
        run: |
          kubectl get namespace "${{ env.NAMESPACE }}" 2>/dev/null || \
          kubectl create namespace "${{ env.NAMESPACE }}"

      - name: Create or Update Kubernetes Secret for DB
        run: |
          kubectl create secret generic spring-boot-db-secret \
            --namespace "${{ env.NAMESPACE }}" \
            --from-literal=SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}" \
            --from-literal=SPRING_DATASOURCE_USERNAME="${{ secrets.SPRING_DATASOURCE_USERNAME }}" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to EKS
        run: |
          ECR_REGISTRY="${{ steps.ecr_login.outputs.registry }}"
          IMAGE_URI="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"

          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${{ env.APP_NAME }}
            namespace: ${{ env.NAMESPACE }}
            labels:
              app: ${{ env.APP_NAME }}
              version: "${{ env.IMAGE_TAG }}"
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: ${{ env.APP_NAME }}
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
            template:
              metadata:
                labels:
                  app: ${{ env.APP_NAME }}
                  version: "${{ env.IMAGE_TAG }}"
              spec:
                containers:
                  - name: ${{ env.APP_NAME }}
                    image: $IMAGE_URI
                    ports:
                      - containerPort: 8080
                    env:
                      - name: SERVER_PORT
                        value: "8080"
                    envFrom:
                      - secretRef:
                          name: spring-boot-db-secret
                    readinessProbe:
                      httpGet:
                        path: /actuator/health
                        port: 8080
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      failureThreshold: 5
                    livenessProbe:
                      httpGet:
                        path: /actuator/health
                        port: 8080
                      initialDelaySeconds: 60
                      periodSeconds: 15
                      failureThreshold: 3
                    resources:
                      requests:
                        cpu: 250m
                        memory: 512Mi
                      limits:
                        cpu: 1000m
                        memory: 1Gi
                imagePullSecrets: []
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${{ env.APP_NAME }}-svc
            namespace: ${{ env.NAMESPACE }}
            labels:
              app: ${{ env.APP_NAME }}
          spec:
            selector:
              app: ${{ env.APP_NAME }}
            ports:
              - protocol: TCP
                port: 80
                targetPort: 8080
            type: ClusterIP
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ${{ env.APP_NAME }}-ingress
            namespace: ${{ env.NAMESPACE }}
            labels:
              app: ${{ env.APP_NAME }}
            annotations:
              kubernetes.io/ingress.class: alb
              alb.ingress.kubernetes.io/scheme: internet-facing
              alb.ingress.kubernetes.io/target-type: ip
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
              alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
              alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
              alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "10"
              alb.ingress.kubernetes.io/healthy-threshold-count: "2"
              alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
          spec:
            rules:
              - http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: ${{ env.APP_NAME }}-svc
                          port:
                            number: 80
          EOF

      - name: Wait for Deployment rollout
        run: |
          kubectl rollout status deployment/${{ env.APP_NAME }} \
            --namespace "${{ env.NAMESPACE }}" \
            --timeout=300s

  verify:
    runs-on: ubuntu-latest
    needs: [provision, configure]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${{ env.AWS_REGION }}" \
            --name "${{ env.EKS_CLUSTER_NAME }}"

      - name: Get ALB Ingress Address
        id: get_alb
        run: |
          echo "Waiting for ALB address to be assigned..."
          for i in $(seq 1 30); do
            ALB_ADDRESS=$(kubectl get ingress "${{ env.APP_NAME }}-ingress" \
              --namespace "${{ env.NAMESPACE }}" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "$ALB_ADDRESS" ]; then
              echo "ALB address: $ALB_ADDRESS"
              echo "alb_address=$ALB_ADDRESS" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Attempt $i/30: ALB not ready yet, waiting 20s..."
            sleep 20
          done
          if [ -z "$ALB_ADDRESS" ]; then
            echo "ALB address not assigned after timeout"
            exit 1
          fi

      - name: Health Check via ALB
        run: |
          ALB_ADDRESS="${{ steps.get_alb.outputs.alb_address }}"
          echo "Running health check against http://$ALB_ADDRESS/actuator/health"
          for i in $(seq 1 15); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              "http://$ALB_ADDRESS/actuator/health" 2>/dev/null || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed with status $HTTP_STATUS"
              break
            fi
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              "http://$ALB_ADDRESS/" 2>/dev/null || echo "000")
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ]; then
              echo "Root health check passed with status $HTTP_STATUS"
              break
            fi
            echo "Attempt $i/15: HTTP status $HTTP_STATUS, retrying in 20s..."
            sleep 20
          done
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "302" ]; then
            echo "Health check failed after all retries. Last status: $HTTP_STATUS"
            exit 1
          fi

      - name: Print Deployment Summary
        run: |
          ALB_ADDRESS="${{ steps.get_alb.outputs.alb_address }}"
          echo "========================================"
          echo "Deployment verified successfully"
          echo "App URL: http://$ALB_ADDRESS"
          echo "Health: http://$ALB_ADDRESS/actuator/health"
          echo "Namespace: ${{ env.NAMESPACE }}"
          echo "Image Tag: ${{ env.IMAGE_TAG }}"
          echo "========================================"
          kubectl get pods --namespace "${{ env.NAMESPACE }}" -l app=${{ env.APP_NAME }}

  notify:
    runs-on: ubuntu-latest
    needs: [provision, verify]
    if: always()
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${{ env.AWS_REGION }}" \
            --name "${{ env.EKS_CLUSTER_NAME }}"

      - name: Collect Deployment Status
        id: status
        run: |
          VERIFY_RESULT="${{ needs.verify.result }}"
          PROVISION_RESULT="${{ needs.provision.result }}"
          if [ "$VERIFY_RESULT" = "success" ] && [ "$PROVISION_RESULT" = "success" ]; then
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "emoji=❌" >> "$GITHUB_OUTPUT"
          fi

          ALB_ADDRESS=$(kubectl get ingress "${{ env.APP_NAME }}-ingress" \
            --namespace "${{ env.NAMESPACE }}" \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "unavailable")
          echo "alb_address=$ALB_ADDRESS" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data '{
              "text": "${{ steps.status.outputs.emoji }} *${{ env.PROJECT_NAME }}/${{ env.APP_NAME }}* deployment *${{ steps.status.outputs.status }}*\n• Cluster: `${{ env.EKS_CLUSTER_NAME }}`\n• Region: `${{ env.AWS_REGION }}`\n• Image: `${{ env.IMAGE_TAG }}`\n• URL: http://${{ steps.status.outputs.alb_address }}\n• Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>"
            }'

      - name: Final Status
        run: |
          echo "========================================"
          echo "Deployment Status : ${{ steps.status.outputs.status }}"
          echo "Project           : ${{ env.PROJECT_NAME }}"
          echo "App               : ${{ env.APP_NAME }}"
          echo "Cluster           : ${{ env.EKS_CLUSTER_NAME }}"
          echo "Region            : ${{ env.AWS_REGION }}"
          echo "Image Tag         : ${{ env.IMAGE_TAG }}"
          echo "ALB Address       : ${{ steps.status.outputs.alb_address }}"
          echo "Run URL           : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "========================================"
          if [ "${{ steps.status.outputs.status }}" != "SUCCESS" ]; then
            exit 1
          fi